function importBookings() {
  try {
    // Get existing bookings
    const existing = JSON.parse(localStorage.getItem('bookings') || '[]');
    
    // Remove any existing June 2026 bookings to avoid duplicates
    const filtered = existing.filter(b => !(b.month === 6 && b.year === 2026));
    
    // Merge
    const merged = [...filtered, ...JUNE_BOOKINGS];
    localStorage.setItem('bookings', JSON.stringify(merged));
    
    document.getElementById('result').innerHTML = 
      '<div class="success">✅ تم استيراد ' + JUNE_BOOKINGS.length + ' حجز بنجاح!<br>يمكنك الآن إغلاق هذه الصفحة والرجوع للتطبيق</div>';
  } catch(e) {
    document.getElementById('result').innerHTML = '<div class="error">❌ خطأ: ' + e.message + '</div>';
  }
}
