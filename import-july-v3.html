};

function importData() {
  try {
    const existing = JSON.parse(localStorage.getItem('bookings') || '[]');
    localStorage.setItem('bookings', JSON.stringify([...existing.filter(b => !(b.month===7&&b.year===2026)), ...JULY_BOOKINGS]));

    const existingExp = JSON.parse(localStorage.getItem('expenses') || '[]');
    localStorage.setItem('expenses', JSON.stringify([...existingExp.filter(e => !(e.month===7&&e.year===2026)), ...JULY_EXPENSES]));

    localStorage.setItem('openingBalance', JSON.stringify(OPENING_BALANCE));

    document.getElementById('result').innerHTML =
      '<div class="success">✅ تم الاستيراد — 17 حجز + 5 مصاريف + رصيد مصحح<br>أغلق هذه الصفحة وافتح التطبيق</div>';

}

function clearJuly() {
  if (!confirm('مسح يوليو 2026؟')) return;
  try {
    localStorage.setItem('bookings', JSON.stringify(JSON.parse(localStorage.getItem('bookings')||'[]').filter(x=>!(x.month===7&&x.year===2026))));

    document.getElementById('result').innerHTML = '<div class="success">✅ تم المسح</div>';
