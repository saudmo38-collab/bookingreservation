function importData() {
  try {
    // إضافة البيانات التاريخية بدون حذف البيانات الحالية
    const existing = JSON.parse(localStorage.getItem('bookings') || '[]');
    const existingExp = JSON.parse(localStorage.getItem('expenses') || '[]');
    
    // احذف أي بيانات تاريخية قديمة أولاً
    const filteredB = existing.filter(b => !b.historical);
    const filteredE = existingExp.filter(e => !e.historical);
    
    // أضف الجديدة
    localStorage.setItem('bookings', JSON.stringify([...HIST_BOOKINGS, ...filteredB]));
    localStorage.setItem('expenses', JSON.stringify([...HIST_EXPENSES, ...filteredE]));
    
    document.getElementById('result').innerHTML =
      '<div class="success">✅ تم الاستيراد بنجاح<br>124 إيراد + 128 مصروف<br>أغلق هذه الصفحة وافتح التطبيق</div>';
  } catch(e) {
    document.getElementById('result').innerHTML = '<div class="error">❌ ' + e.message + '</div>';
  }
}

function clearHistorical() {
  if (!confirm('مسح كل البيانات التاريخية؟')) return;
  try {
    const b = JSON.parse(localStorage.getItem('bookings')||'[]').filter(x=>!x.historical);
    const e = JSON.parse(localStorage.getItem('expenses')||'[]').filter(x=>!x.historical);
    localStorage.setItem('bookings', JSON.stringify(b));
    localStorage.setItem('expenses', JSON.stringify(e));
    document.getElementById('result').innerHTML = '<div class="success">✅ تم المسح</div>';
  } catch(e) {
    document.getElementById('result').innerHTML = '<div class="error">❌ ' + e.message + '</div>';
  }
}
</script>
</body>
</html>
